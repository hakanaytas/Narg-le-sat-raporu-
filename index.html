<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nargile Satış Takip</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#162032;
    --border:#2b3a52;
    --text:#f1f5f9;
    --sub:#94a3b8;
    --my:#22c55e;
    --cafe:#3b82f6;
    --danger:#ef4444;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:24px;
  }
  header{
    padding:16px 16px 8px;
    text-align:center;
  }
  header h1{
    font-size:20px;
    margin:0 0 12px;
  }
  .tabs{
    display:flex;
    gap:8px;
    background:var(--card2);
    padding:4px;
    border-radius:12px;
  }
  .tab-btn{
    flex:1;
    padding:10px 4px;
    border:none;
    border-radius:9px;
    background:transparent;
    color:var(--sub);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--card);
    color:var(--text);
  }
  main{padding:16px;}
  .hidden{display:none;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:14px;
    margin:0 0 10px;
    color:var(--sub);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  .qty-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:14px;
  }
  .qty-btn{
    width:48px;height:48px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:22px;
    font-weight:700;
    cursor:pointer;
  }
  .qty-num{
    font-size:28px;
    font-weight:700;
    min-width:40px;
    text-align:center;
  }

  .sell-btn{
    width:100%;
    padding:22px;
    font-size:22px;
    font-weight:800;
    border:none;
    border-radius:18px;
    background:var(--my);
    color:#04220f;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .sell-btn:active{opacity:.85;}

  .last-sale{
    margin-top:14px;
    font-size:14px;
    color:var(--sub);
    line-height:1.6;
  }
  .last-sale b{color:var(--text);}

  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat-box{
    background:var(--card2);
    border-radius:12px;
    padding:12px;
    text-align:center;
  }
  .stat-box .label{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .stat-box .value{font-size:18px;font-weight:700;}
  .stat-my .value{color:var(--my);}
  .stat-cafe .value{color:var(--cafe);}

  .z-btn{
    width:100%;
    padding:16px;
    font-size:16px;
    font-weight:700;
    border:none;
    border-radius:14px;
    background:var(--cafe);
    color:#03142e;
    cursor:pointer;
  }

  .price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .price-current{font-size:22px;font-weight:800;}
  .price-edit-btn{
    padding:8px 14px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .price-form{
    display:none;
    margin-top:12px;
    gap:8px;
  }
  .price-form.open{display:flex;}
  .price-form input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:16px;
  }
  .price-form button{
    padding:12px 16px;
    border:none;
    border-radius:10px;
    background:var(--my);
    color:#04220f;
    font-weight:700;
    cursor:pointer;
  }
  .price-hint{
    font-size:12px;
    color:var(--sub);
    margin-top:8px;
  }

  .report-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .report-row:last-child{border-bottom:none;}
  .report-row .l{color:var(--sub);}
  .report-row .r{font-weight:700;}

  .pie-wrap{
    display:flex;
    align-items:center;
    gap:20px;
    justify-content:center;
    padding:8px 0;
  }
  .pie{
    width:120px;height:120px;
    border-radius:50%;
    flex-shrink:0;
  }
  .legend{font-size:13px;line-height:2;}
  .dot{
    display:inline-block;
    width:10px;height:10px;
    border-radius:50%;
    margin-right:6px;
  }

  .sale-list{margin-top:6px;}
  .sale-item{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:7px 0;
    border-bottom:1px solid var(--border);
    color:var(--sub);
  }
  .sale-item:last-child{border-bottom:none;}
  .sale-item .t{color:var(--text);font-weight:600;}

  .empty{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    padding:20px 0;
  }

  .day-card{cursor:pointer;}
  .day-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .day-head .date{font-weight:700;font-size:15px;}
  .day-head .count{font-size:13px;color:var(--sub);}
  .day-detail{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
    display:none;
  }
  .day-detail.open{display:block;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🪔 Nargile Satış Takip</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="ana">Ana Ekran</button>
      <button class="tab-btn" data-tab="z">Z Raporu</button>
      <button class="tab-btn" data-tab="gecmis">Geçmiş</button>
    </div>
  </header>

  <!-- ANA EKRAN -->
  <main id="tab-ana">
    <div class="card">
      <h2>Nargile Fiyatı</h2>
      <div class="price-row">
        <div class="price-current" id="priceCurrent">290 TL</div>
        <button class="price-edit-btn" id="priceEditBtn">Fiyatı Değiştir</button>
      </div>
      <div class="price-form" id="priceForm">
        <input type="number" id="priceInput" min="1" step="1" placeholder="Yeni fiyat (TL)">
        <button id="priceSaveBtn">Kaydet</button>
      </div>
      <div class="price-hint" id="priceHint"></div>
    </div>

    <div class="card">
      <h2>Satış Yap</h2>
      <div class="qty-row">
        <button class="qty-btn" id="qtyMinus">−</button>
        <div class="qty-num" id="qtyNum">1</div>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
      <button class="sell-btn" id="sellBtn">NARGİLE SAT</button>
      <div class="last-sale" id="lastSale"></div>
    </div>

    <div class="card">
      <h2>Bugün</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="label">Nargile Adedi</div>
          <div class="value" id="todayCount">0</div>
        </div>
        <div class="stat-box">
          <div class="label">Toplam Ciro</div>
          <div class="value" id="todayRevenue">0 TL</div>
        </div>
        <div class="stat-box stat-my">
          <div class="label">Benim Payım</div>
          <div class="value" id="todayMy">0 TL</div>
        </div>
        <div class="stat-box stat-cafe">
          <div class="label">Cafe Payı</div>
          <div class="value" id="todayCafe">0 TL</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Z RAPORU -->
  <main id="tab-z" class="hidden">
    <div class="card">
      <button class="z-btn" id="zBtn">Z RAPORU AL</button>
    </div>
    <div id="zResult"></div>
  </main>

  <!-- GEÇMİŞ -->
  <main id="tab-gecmis" class="hidden">
    <div id="gecmisList"></div>
  </main>
</div>

<script>
const STORAGE_KEY="nargile_sales_v1";
const PRICE_KEY="nargile_price_v1";
const MY_RATE=0.6, CAFE_RATE=0.4;

function loadSales(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function saveSales(sales){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sales));
}
function loadPrice(){
  const p=parseFloat(localStorage.getItem(PRICE_KEY));
  return (!isNaN(p) && p>0) ? p : 290;
}
function savePrice(p){
  localStorage.setItem(PRICE_KEY, p);
}

let sales = loadSales();
let PRICE = loadPrice();
let MY_SHARE = Math.round(PRICE*MY_RATE);
let CAFE_SHARE = PRICE - MY_SHARE;
let qty = 1;

function refreshPriceUI(){
  document.getElementById('priceCurrent').textContent = fmt(PRICE);
  document.getElementById('priceHint').textContent =
    'Bu fiyata göre: Benim payım '+fmt(MY_SHARE)+' (%60) · Cafe payı '+fmt(CAFE_SHARE)+' (%40)';
}

function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function timeStr(){
  const d=new Date();
  return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
function fmt(n){
  return n.toLocaleString('tr-TR')+' TL';
}
function displayDate(dateStr){
  const [y,m,d]=dateStr.split('-');
  return d+'.'+m+'.'+y;
}

/* ---- FİYAT AYARI ---- */
document.getElementById('priceEditBtn').addEventListener('click', ()=>{
  const form=document.getElementById('priceForm');
  form.classList.toggle('open');
  document.getElementById('priceInput').value=PRICE;
  if(form.classList.contains('open')) document.getElementById('priceInput').focus();
});
document.getElementById('priceSaveBtn').addEventListener('click', ()=>{
  const val=parseFloat(document.getElementById('priceInput').value);
  if(isNaN(val) || val<=0){
    alert('Lütfen geçerli bir fiyat girin.');
    return;
  }
  PRICE=val;
  MY_SHARE=Math.round(PRICE*MY_RATE);
  CAFE_SHARE=PRICE-MY_SHARE;
  savePrice(PRICE);
  refreshPriceUI();
  document.getElementById('priceForm').classList.remove('open');
});
refreshPriceUI();

/* ---- TAB NAVIGASYON ---- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main').forEach(m=>m.classList.add('hidden'));
    document.getElementById('tab-'+btn.dataset.tab).classList.remove('hidden');
    if(btn.dataset.tab==='gecmis') renderGecmis();
    if(btn.dataset.tab==='z') document.getElementById('zResult').innerHTML='';
  });
});

/* ---- ADET SEÇİMİ ---- */
document.getElementById('qtyPlus').addEventListener('click', ()=>{
  qty++; document.getElementById('qtyNum').textContent=qty;
});
document.getElementById('qtyMinus').addEventListener('click', ()=>{
  if(qty>1) qty--;
  document.getElementById('qtyNum').textContent=qty;
});

/* ---- SATIŞ ---- */
document.getElementById('sellBtn').addEventListener('click', ()=>{
  const record={
    date: todayStr(),
    time: timeStr(),
    adet: qty,
    ciro: qty*PRICE,
    benim: qty*MY_SHARE,
    cafe: qty*CAFE_SHARE
  };
  sales.push(record);
  saveSales(sales);

  document.getElementById('lastSale').innerHTML =
    'Son satış: <b>'+record.time+'</b> — '+record.adet+' adet — '+
    'Ciro: <b>'+fmt(record.ciro)+'</b> · Benim: <b>'+fmt(record.benim)+'</b> · Cafe: <b>'+fmt(record.cafe)+'</b>';

  qty=1;
  document.getElementById('qtyNum').textContent=qty;
  renderToday();
});

/* ---- BUGÜNKÜ İSTATİSTİK ---- */
function todaysSales(){
  const t=todayStr();
  return sales.filter(s=>s.date===t);
}
function renderToday(){
  const list=todaysSales();
  const count=list.reduce((a,s)=>a+s.adet,0);
  const revenue=list.reduce((a,s)=>a+s.ciro,0);
  const my=list.reduce((a,s)=>a+s.benim,0);
  const cafe=list.reduce((a,s)=>a+s.cafe,0);
  document.getElementById('todayCount').textContent=count;
  document.getElementById('todayRevenue').textContent=fmt(revenue);
  document.getElementById('todayMy').textContent=fmt(my);
  document.getElementById('todayCafe').textContent=fmt(cafe);
}

/* ---- Z RAPORU ---- */
document.getElementById('zBtn').addEventListener('click', ()=>{
  const list=todaysSales();
  const count=list.reduce((a,s)=>a+s.adet,0);
  const revenue=list.reduce((a,s)=>a+s.ciro,0);
  const my=list.reduce((a,s)=>a+s.benim,0);
  const cafe=list.reduce((a,s)=>a+s.cafe,0);

  let html='<div class="card">';
  html+='<h2>Z Raporu — '+displayDate(todayStr())+'</h2>';
  html+=row('Toplam Nargile', count+' adet');
  html+=row('Toplam Ciro', fmt(revenue));
  html+=row('Benim Payım (%60)', fmt(my));
  html+=row('Cafe Payı (%40)', fmt(cafe));
  html+='</div>';

  if(count>0){
    const myPct=Math.round((my/revenue)*100);
    html+='<div class="card"><h2>Pay Dağılımı</h2><div class="pie-wrap">';
    html+='<div class="pie" style="background:conic-gradient(var(--my) 0% '+myPct+'%, var(--cafe) '+myPct+'% 100%);"></div>';
    html+='<div class="legend">';
    html+='<div><span class="dot" style="background:var(--my)"></span>Benim — %'+myPct+'</div>';
    html+='<div><span class="dot" style="background:var(--cafe)"></span>Cafe — %'+(100-myPct)+'</div>';
    html+='</div></div></div>';
  }

  html+='<div class="card"><h2>Saat Saat Satışlar</h2><div class="sale-list">';
  if(list.length===0){
    html+='<div class="empty">Bugün henüz satış yok.</div>';
  }else{
    list.forEach(s=>{
      html+='<div class="sale-item"><span class="t">'+s.time+'</span><span>'+s.adet+' adet — '+fmt(s.ciro)+'</span></div>';
    });
  }
  html+='</div></div>';

  document.getElementById('zResult').innerHTML=html;
});

function row(label,value){
  return '<div class="report-row"><span class="l">'+label+'</span><span class="r">'+value+'</span></div>';
}

/* ---- GEÇMİŞ RAPORLAR ---- */
function renderGecmis(){
  const days={};
  sales.forEach(s=>{
    if(!days[s.date]) days[s.date]={date:s.date, list:[]};
    days[s.date].list.push(s);
  });
  const dateKeys=Object.keys(days).sort().reverse();

  const container=document.getElementById('gecmisList');
  if(dateKeys.length===0){
    container.innerHTML='<div class="card"><div class="empty">Henüz kayıt yok.</div></div>';
    return;
  }

  let html='';
  dateKeys.forEach(dk=>{
    const list=days[dk].list;
    const count=list.reduce((a,s)=>a+s.adet,0);
    const revenue=list.reduce((a,s)=>a+s.ciro,0);
    const my=list.reduce((a,s)=>a+s.benim,0);
    const cafe=list.reduce((a,s)=>a+s.cafe,0);

    html+='<div class="card day-card" data-date="'+dk+'">';
    html+='<div class="day-head"><span class="date">'+displayDate(dk)+'</span><span class="count">'+count+' nargile · '+fmt(revenue)+'</span></div>';
    html+='<div class="day-detail" id="detail-'+dk+'">';
    html+=row('Satılan Nargile', count+' adet');
    html+=row('Ciro', fmt(revenue));
    html+=row('Benim Payım', fmt(my));
    html+=row('Cafe Payı', fmt(cafe));
    html+='<div class="sale-list">';
    list.forEach(s=>{
      html+='<div class="sale-item"><span class="t">'+s.time+'</span><span>'+s.adet+' adet — '+fmt(s.ciro)+'</span></div>';
    });
    html+='</div></div></div>';
  });
  container.innerHTML=html;

  document.querySelectorAll('.day-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const dk=card.dataset.date;
      document.getElementById('detail-'+dk).classList.toggle('open');
    });
  });
}

/* ---- BAŞLANGIÇ ---- */
renderToday();
</script>
</body>
</html>
